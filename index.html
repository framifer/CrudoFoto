<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1C1B19" />
<link rel="manifest" href="manifest.webmanifest" />
<title>CrudoCamera</title>
<style>
  :root {
    --body-dark: #1C1B19;
    --panel: #2A2825;
    --edge: #0E0D0C;
    --brass: #D9C08A;
    --lcd: #9FE7B0;
    --accent: #B0413E;
    --chrome-l: #BFC3C7;
    --chrome-d: #6E7276;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: linear-gradient(#1C1B19, #0E0D0C, #1C1B19);
    color: var(--brass);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    overflow: hidden; user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; padding: 10px; gap: 8px; }

  /* Calotta superiore */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 10px; padding: 6px 10px;
  }
  .title { font-weight: 700; font-size: 15px; }
  .dials { display: flex; gap: 6px; }
  .dial {
    width: 34px; height: 34px; border-radius: 50%;
    background: #3A3833; border: 1px solid var(--edge); color: var(--brass);
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .dial.active { background: var(--brass); color: var(--edge); }

  /* Mirino */
  .viewfinder {
    position: relative; flex: 1; background: var(--edge);
    border-radius: 6px; padding: 8px;
  }
  .screen {
    position: relative; width: 100%; height: 100%;
    border: 2px solid #3A3833; border-radius: 3px; overflow: hidden; background: #000;
  }
  #gl { width: 100%; height: 100%; display: block; }
  .lcd {
    position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.6);
    color: var(--lcd); font-weight: 700; font-size: 12px;
    padding: 1px 5px; border-radius: 3px;
  }
  .lcd-right { left: auto; right: 6px; }
  .grid { position: absolute; inset: 0; pointer-events: none; display: none; }
  .grid.on { display: block; }

  /* Barra raggio fuoco sotto "CrudoCamera", a sinistra (orizzontale) */
  .focus-bar {
    display: none; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 8px; padding: 6px 10px;
  }
  .focus-bar.on { display: flex; }
  .focus-ico { color: var(--lcd); font-size: 12px; font-weight: 700; }
  .focus-bar input[type=range] { flex: 1; accent-color: var(--lcd); }
  /* Mirino di fuoco semitrasparente (crocetta nel cerchio) */
  .focus-marker {
    position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px;
    border: 2px solid var(--lcd); border-radius: 50%; display: none;
    pointer-events: none; opacity: 0.7;
  }
  .focus-marker::before, .focus-marker::after {
    content: ''; position: absolute; background: var(--lcd);
  }
  .focus-marker::before { left: 50%; top: 33%; width: 2px; height: 34%; margin-left: -1px; }
  .focus-marker::after  { top: 50%; left: 33%; height: 2px; width: 34%; margin-top: -1px; }
  .focus-marker.on { display: block; }

  /* Ghiere / rullini */
  .rail {
    display: flex; gap: 5px; background: var(--panel);
    border-radius: 8px; padding: 6px; overflow-x: auto;
  }
  .rail.focals .chip { flex: 1; }
  .chip {
    white-space: nowrap; background: #3A3833; color: var(--brass);
    border-radius: 6px; padding: 6px 10px; font-size: 12px; text-align: center;
  }
  .chip.active { background: var(--brass); color: var(--edge); font-weight: 700; }

  /* Intensita' */
  .intensity { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
  .intensity label { font-size: 11px; font-weight: 700; }
  .intensity input { flex: 1; accent-color: var(--brass); }
  .intensity .val { color: var(--lcd); font-weight: 700; font-size: 12px; }

  /* Piastra inferiore */
  .bottom {
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(var(--panel), var(--edge));
    border: 1px solid var(--edge); border-radius: 10px; padding: 12px 16px;
  }
  .round {
    width: 62px; height: 62px; border-radius: 50%;
    background: radial-gradient(#3A3833, #0E0D0C);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
  }
  .round.rec { border: 2px solid #4C7A4C; color: #4C7A4C; }
  .round.rec.active { border-color: var(--accent); color: var(--accent); }
  .round.flash { border: 2px solid var(--chrome-d); color: var(--chrome-d); }
  .round.flash.active { border-color: var(--brass); color: var(--brass); }
  .round.dial-shutter {
    border: 2px solid var(--brass); color: var(--lcd);
    font-weight: 700; font-size: 11px;
    transition: transform .25s ease;
    background:
      radial-gradient(#3A3833, #0E0D0C);
  }
  .shutter {
    width: 84px; height: 84px; border-radius: 50%;
    background: radial-gradient(var(--chrome-l), var(--chrome-d));
    border: 3px solid var(--edge);
    display: flex; align-items: center; justify-content: center;
  }
  .shutter .inner {
    width: 58px; height: 58px; border-radius: 50%;
    background: radial-gradient(#3A3833, #0E0D0C);
    border: 2px solid var(--chrome-d);
    display: flex; align-items: center; justify-content: center;
  }
  .shutter .dot { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); }
  .shutter:active { transform: scale(0.96); }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.85); color: #fff; padding: 8px 14px;
    border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; z-index: 10;
  }
  .toast.show { opacity: 1; }

  /* Guida effetti */
  .info-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.8);
    display: none; align-items: center; justify-content: center; z-index: 20;
  }
  .info-overlay.show { display: flex; }
  .info-box {
    width: 92%; max-width: 520px; height: 82%;
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 12px; padding: 14px; display: flex; flex-direction: column;
  }
  .info-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .info-title { color: var(--brass); font-weight: 700; font-size: 16px; }
  .info-actions { display: flex; align-items: center; gap: 6px; }
  .info-lang {
    background: #3A3833; color: var(--brass); border-radius: 6px;
    padding: 4px 10px; font-size: 12px;
  }
  .info-lang.active { background: var(--brass); color: var(--edge); font-weight: 700; }
  .info-list { overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .info-item .n { color: var(--lcd); font-weight: 700; font-size: 14px; }
  .info-item .d { color: var(--brass); font-size: 13px; margin-top: 3px; }

  /* Menu dal titolo */
  .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; z-index: 25; }
  .menu-overlay.show { display: block; }
  .menu-box {
    position: absolute; top: 58px; left: 14px; background: var(--panel);
    border: 1px solid var(--edge); border-radius: 10px; padding: 6px 0; min-width: 240px;
  }
  .menu-title { color: var(--brass); font-weight: 700; font-size: 13px; padding: 6px 16px; }
  .menu-item { color: var(--lcd); font-size: 14px; padding: 10px 16px; cursor: pointer; }
  .menu-item:active { background: #3A3833; }

  /* Editor post-produzione */
  .editor-overlay {
    position: fixed; inset: 0; z-index: 30; display: none; flex-direction: column;
    background: linear-gradient(#1C1B19, #0E0D0C, #1C1B19); padding: 10px; gap: 8px;
  }
  .editor-overlay.show { display: flex; }
  .editor-top {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); border-radius: 10px; padding: 6px 10px;
  }
  .editor-title { color: var(--brass); font-weight: 700; font-size: 15px; }
  .editor-screen { flex: 1; background: var(--edge); border-radius: 6px; padding: 8px; }
  #editGl { width: 100%; height: 100%; display: block; }
  .editor-save {
    text-align: center; color: var(--edge); background: var(--brass);
    font-weight: 700; border-radius: 10px; padding: 12px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="title" id="appTitle" style="cursor:pointer">CrudoCamera ▾</div>
    <div class="dials">
      <div class="dial" id="dFlip">&#8635;</div>
      <div class="dial" id="dFocus">&#9673;</div>
      <div class="dial active" id="dSound">&#9834;</div>
      <div class="dial" id="dGrid">&#9638;</div>
      <div class="dial" id="dFlash">&#9889;</div>
      <div class="dial" id="dInfo">i</div>
    </div>
  </div>

  <!-- Slider raggio fuoco: nella striscia sotto "CrudoCamera", a sinistra -->
  <div class="focus-bar" id="focusBar">
    <span class="focus-ico">&#9673; Fuoco</span>
    <input type="range" id="focusRange" min="5" max="60" value="25" />
  </div>

  <div class="viewfinder">
    <div class="screen">
      <video id="video" autoplay playsinline muted style="display:none"></video>
      <canvas id="gl"></canvas>
      <canvas class="grid" id="grid"></canvas>
      <div class="lcd lcd-right" id="lcd">NAT</div>
      <div class="focus-marker" id="focusMarker"></div>
    </div>
  </div>

  <audio id="shutterAudio" src="shutter.ogg" preload="auto"></audio>

  <div class="rail focals" id="focals"></div>
  <div class="rail" id="effects"></div>

  <div class="intensity">
    <label>INTENSITÀ</label>
    <input type="range" id="intensity" min="0" max="100" value="100" />
    <span class="val" id="intVal">100%</span>
  </div>

  <div class="bottom">
    <div class="round rec" id="btnRec">REC</div>
    <div class="shutter" id="btnShot"><div class="inner"><div class="dot"></div></div></div>
    <div class="round dial-shutter" id="btnShutter"><span id="shutterVal">1/60</span></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- Finestra guida agli effetti -->
<div class="info-overlay" id="infoOverlay">
  <div class="info-box">
    <div class="info-head">
      <span class="info-title" id="infoTitle">Guida agli effetti</span>
      <span class="info-actions">
        <span class="info-lang active" id="langIt">IT</span>
        <span class="info-lang" id="langEn">EN</span>
        <span class="dial" id="infoClose">&#10005;</span>
      </span>
    </div>
    <div class="info-list" id="infoList"></div>
  </div>
</div>

<!-- Menu dal titolo -->
<div class="menu-overlay" id="menuOverlay">
  <div class="menu-box">
    <div class="menu-title">CrudoCamera</div>
    <div class="menu-item" id="menuImport">📷&nbsp; Importa foto (post-produzione)</div>
  </div>
</div>
<input type="file" id="photoInput" accept="image/*" style="display:none" />

<!-- Editor post-produzione -->
<div class="editor-overlay" id="editorOverlay">
  <div class="editor-top">
    <span class="editor-title">Post-produzione</span>
    <span class="dial" id="editorClose">&#10005;</span>
  </div>
  <div class="editor-screen">
    <canvas id="editGl"></canvas>
  </div>
  <div class="rail" id="editEffects"></div>
  <div class="intensity">
    <label>INTENSITÀ</label>
    <input type="range" id="editIntensity" min="0" max="100" value="100" />
    <span class="val" id="editIntVal">100%</span>
  </div>
  <div class="editor-save" id="editorSave">💾&nbsp; Scarica foto</div>
</div>

<script src="app.js"></script>
</body>
</html>
